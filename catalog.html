<style>
:root{--k:#000;--w:#fff;--muted:#a8a8a8;--f:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--k);color:var(--w);font-family:var(--f);-webkit-text-size-adjust:100%}
a{color:inherit}
.bar{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #222}
.bar .in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.bar img{height:44px;width:auto;display:block}
.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border:2px solid var(--w);background:var(--w);color:var(--k);font:800 12px var(--f);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--w)}
.btn.o{background:transparent;color:var(--w)}.btn.o:hover{background:var(--w);color:var(--k)}
.btn:focus-visible{outline:3px solid var(--w);outline-offset:3px}
header.top{max-width:1240px;margin:0 auto;padding:56px 20px 28px}
h1{margin:0;font-weight:900;font-size:clamp(34px,6.4vw,84px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap}
.sub{margin:14px 0 0;color:var(--muted);font-weight:500;font-size:clamp(15px,1.6vw,18px)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
main{max-width:1240px;margin:0 auto;padding:8px 20px 40px;display:grid;gap:22px}
figure{margin:0}
figure a{display:block;line-height:0;border:1px solid #222}
figure img{width:100%;height:auto;display:block;aspect-ratio:842/595;background:#111}
.tip{display:none;color:var(--muted);font-size:13px;font-weight:500;margin:0}
footer{max-width:1240px;margin:0 auto;padding:28px 20px 60px;border-top:1px solid #222;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:500}
footer .acts{margin:0}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--w);text-decoration:none;font:800 13px var(--f);letter-spacing:.06em;text-transform:uppercase;padding:10px 8px 10px 0;margin-right:4px;white-space:nowrap}
.back:focus-visible{outline:3px solid var(--w);outline-offset:2px}
.bar .in{padding-top:max(12px,env(safe-area-inset-top));}
/* full-screen page viewer */
.lb{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column}
.lb.on{display:flex}
.lb .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #222}
.lb .top b{font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.lb button{font:800 13px var(--f);letter-spacing:.06em;text-transform:uppercase;background:var(--w);color:var(--k);border:2px solid var(--w);padding:10px 14px;cursor:pointer;white-space:nowrap}
.lb button.o{background:transparent;color:var(--w)}
.lb button:disabled{opacity:.3;cursor:default}
.lb .view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;touch-action:pan-x pan-y pinch-zoom}
.lb .view img{display:block;margin:auto;width:min(100%,1600px);height:auto}
.lb.zoom .view{align-items:flex-start}
.lb.zoom .view img{width:220%;max-width:none}
.lb .nav{display:flex;gap:10px;justify-content:space-between;padding:10px 14px max(12px,env(safe-area-inset-bottom));border-top:1px solid #222}
.lb .nav button{flex:1}
@media(min-width:900px){.lb.zoom .view img{width:160%}}
@media(max-width:700px){
  .bar img{height:36px}.bar .btn{padding:10px 12px;font-size:11px}
  header.top{padding:36px 16px 20px}main{padding:4px 12px 28px;gap:12px}
  .tip{display:block}
  .acts .btn{flex:1}
  footer{padding:24px 16px 48px}
}
</style>
</head>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Catalog page">
  <div class="top"><b id="lbN">Page 1 of 9</b><div style="display:flex;gap:8px"><button type="button" class="o" id="lbZ">Zoom</button><button type="button" id="lbX">Close</button></div></div>
  <div class="view" id="lbV"><img id="lbI" alt=""></div>
  <div class="nav"><button type="button" class="o" id="lbP">Previous</button><button type="button" class="o" id="lbF">Next</button></div>
</div>
<script>
(function(){
  const app=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  // Back: return to the page we came from on this site, otherwise go to the home page.
  const back=document.getElementById('back');
  back.addEventListener('click',e=>{
    let same=false;try{same=document.referrer&&new URL(document.referrer).origin===location.origin}catch(_){}
    if(same&&history.length>1){e.preventDefault();history.back()}
  });
  // In the home-screen app, the PDF opens in a viewer that can be closed.
  if(app)document.querySelectorAll('a[href$=".pdf"]').forEach(a=>{a.removeAttribute('download');a.target='_blank';a.rel='noopener'});
  // Page viewer
  const figs=[...document.querySelectorAll('a[data-page]')],N=figs.length,lb=document.getElementById('lb'),img=document.getElementById('lbI');
  let cur=0,open=false;
  function show(i){cur=(i+N)%N;const a=figs[cur];img.src=a.getAttribute('href');img.alt=a.querySelector('img').alt;
    document.getElementById('lbN').textContent=`Page ${cur+1} of ${N}`;document.getElementById('lbP').disabled=cur===0;document.getElementById('lbF').disabled=cur===N-1;
    document.getElementById('lbV').scrollTo(0,0)}
  function openLb(i){show(i);lb.classList.add('on');document.body.style.overflow='hidden';if(!open){open=true;history.pushState({lb:1},'')};document.getElementById('lbX').focus()}
  function closeLb(fromPop){if(!open)return;open=false;lb.classList.remove('on','zoom');document.getElementById('lbZ').textContent='Zoom';document.body.style.overflow='';
    figs[cur].focus({preventScroll:true});if(!fromPop)history.back()}
  figs.forEach((a,i)=>a.addEventListener('click',e=>{e.preventDefault();openLb(i)}));
  document.getElementById('lbX').onclick=()=>closeLb(false);
  document.getElementById('lbP').onclick=()=>show(cur-1);
  document.getElementById('lbF').onclick=()=>show(cur+1);
  document.getElementById('lbZ').onclick=e=>{const z=lb.classList.toggle('zoom');e.target.textContent=z?'Fit':'Zoom'};
  addEventListener('popstate',()=>{if(open)closeLb(true)}); // phone back gesture closes the viewer
  addEventListener('keydown',e=>{if(!open)return;if(e.key==='Escape')closeLb(false);if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
  // swipe left/right to change page (when not zoomed)
  let x0=null;lb.addEventListener('touchstart',e=>{x0=e.touches.length===1?e.touches[0].clientX:null},{passive:true});
  lb.addEventListener('touchend',e=>{if(x0===null||lb.classList.contains('zoom'))return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60)show(cur+(dx<0?1:-1));x0=null},{passive:true});
})();
</script>
