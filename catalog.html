<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<title>Artisanal Ice Catalog – On The Rocks</title>
<meta name="description" content="On The Rocks artisanal ice catalog: The Cube, The Hulk, The Globe, The Pillar, The Diamond, Shot Glasses, The Rose, infused ice and punch blocks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--k:#000;--w:#fff;--muted:#a8a8a8;--f:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--k);color:var(--w);font-family:var(--f);-webkit-text-size-adjust:100%}
a{color:inherit}
.bar{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #222}
.bar .in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.bar img{height:44px;width:auto;display:block}
.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border:2px solid var(--w);background:var(--w);color:var(--k);font:800 12px var(--f);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--w)}
.btn.o{background:transparent;color:var(--w)}.btn.o:hover{background:var(--w);color:var(--k)}
.btn:focus-visible{outline:3px solid var(--w);outline-offset:3px}
header.top{max-width:1240px;margin:0 auto;padding:56px 20px 28px}
h1{margin:0;font-weight:900;font-size:clamp(34px,6.4vw,84px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap}
.sub{margin:14px 0 0;color:var(--muted);font-weight:500;font-size:clamp(15px,1.6vw,18px)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
main{max-width:1240px;margin:0 auto;padding:8px 20px 40px;display:grid;gap:22px}
figure{margin:0}
figure a{display:block;line-height:0;border:1px solid #222}
figure img{width:100%;height:auto;display:block;aspect-ratio:842/595;background:#111}
.tip{display:none;color:var(--muted);font-size:13px;font-weight:500;margin:0}
footer{max-width:1240px;margin:0 auto;padding:28px 20px 60px;border-top:1px solid #222;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:500}
footer .acts{margin:0}
@media(max-width:700px){
  .bar img{height:36px}.bar .btn{padding:10px 12px;font-size:11px}
  header.top{padding:36px 16px 20px}main{padding:4px 12px 28px;gap:12px}
  .tip{display:block}
  .acts .btn{flex:1}
  footer{padding:24px 16px 48px}
}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <a href="/" aria-label="On The Rocks home"><img src="/catalog-files/logo-white.png" alt="On The Rocks"></a>
  <span class="sp"></span>
  <a class="btn o" href="/#store">Shop Now</a>
</div></div>

<header class="top">
  <h1>Artisanal Ice</h1>
  <p class="sub">Our Full Catalog Of Hand-Cut Ice.</p>
  <div class="acts">
    <a class="btn" href="/catalog-files/OnTheRocks_Catalog.pdf" download="OnTheRocks_Catalog.pdf">Download PDF</a>
    <a class="btn o" href="/#quote">Get A Quote</a>
  </div>
</header>

<main>
  <p class="tip">Tap a page to see it full size.</p>
  <figure><a href="/catalog-files/page-1.jpg" target="_blank" rel="noopener"><img src="/catalog-files/page-1.jpg" alt="On The Rocks – Artisan Ice catalog cover" width="2000" height="1414"></a></figure>
  <figure><a href="/catalog-files/page-2.jpg" target="_blank" rel="noopener"><img loading="lazy" src="/catalog-files/page-2.jpg" alt="Welcome to On The Rocks – premier ice solutions" width="2000" height="1414"></a></figure>
  <figure><a href="/catalog-files/page-3.jpg" target="_blank" rel="noopener"><img loading="lazy" src="/catalog-files/page-3.jpg" alt="Why clear ice: aesthetic, 100% pure and practical" width="2000" height="1414"></a></figure>
  <figure><a href="/catalog-files/page-4.jpg" target="_blank" rel="noopener"><img loading="lazy" src="/catalog-files/page-4.jpg" alt="Main cuts: The Cube (5 cm) and The Hulk (5 × 5 × 7 cm)" width="2000" height="1414"></a></figure>
  <figure><a href="/catalog-files/page-5.jpg" target="_blank" rel="noopener"><img loading="lazy" src="/catalog-files/page-5.jpg" alt="Main cuts: The Globe (55 mm) and The Pillar (4 × 4 × 12 cm)" width="2000" height="1414"></a></figure>
  <figure><a href="/catalog-files/page-6.jpg" target="_blank" rel="noopener"><img loading="lazy" src="/catalog-files/page-6.jpg" alt="Other cuts: The Diamond, Shot Glasses, The Rose" width="2000" height="1414"></a></figure>
  <figure><a href="/catalog-files/page-7.jpg" target="_blank" rel="noopener"><img loading="lazy" src="/catalog-files/page-7.jpg" alt="Infusions: flowers, fruit and herbs frozen into clear ice" width="2000" height="1414"></a></figure>
  <figure><a href="/catalog-files/page-8.jpg" target="_blank" rel="noopener"><img loading="lazy" src="/catalog-files/page-8.jpg" alt="Punch block: clear ice centrepieces in any size" width="2000" height="1414"></a></figure>
  <figure><a href="/catalog-files/page-9.jpg" target="_blank" rel="noopener"><img loading="lazy" src="/catalog-files/page-9.jpg" alt="Contact On The Rocks: +91 60033 68214, info@frostworkscorp.com, @ontherocks.in" width="2000" height="1414"></a></figure>
</main>

<footer>
  <span>© 2026 On The Rocks™ · Frostworks Corporation, Guwahati</span>
  <div class="acts">
    <a class="btn o" href="https://wa.me/916003368214" target="_blank" rel="noopener">WhatsApp Us</a>
    <a class="btn" href="/#store">Shop Now</a>
  </div>
</footer>
</body>
</html>
